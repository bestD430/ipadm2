<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>交通看板 - iPad Mini 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      position: relative;
    }

    /* ===== 第一行：時間、日期、天氣 ===== */
    .section-top {
      border-bottom: 2px solid #333;
      padding-bottom: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    /* 隱藏選單觸發按鈕 */
    .settings-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 28px;
      padding: 5px;
      cursor: pointer;
      z-index: 10;
    }

    .time-display {
      font-size: 72px;
      font-weight: 200;
      line-height: 1;
      letter-spacing: -2px;
    }

    .date-display {
      font-size: 20px;
      color: #8e8e93;
      margin-top: 6px;
    }

    .weather-container {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      background: #1c1c1e;
      border-radius: 12px;
      padding: 12px 16px;
    }

    .weather-box {
      width: 48%;
    }

    .weather-district {
      font-size: 16px;
      color: #0a84ff;
      font-weight: 600;
    }

    .weather-temp {
      font-size: 28px;
      font-weight: 300;
    }

    .weather-desc {
      font-size: 12px;
      color: #8e8e93;
    }

    /* ===== 第二行：巴士動態卡片 ===== */
    .section-bus {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .bus-card {
      background-color: #1c1c1e;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
