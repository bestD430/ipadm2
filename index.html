<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>交通天氣看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
      -webkit-user-select: none;
    }

    /* 第一行：時間、日期與雙區天氣 */
    .section-top {
      flex: 0 0 35%;
      border-bottom: 2px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 15px;
    }

    .time-large {
      font-size: 80px;
      font-weight: 200;
      line-height: 1;
      color: #ffffff;
      letter-spacing: -2px;
    }

    .date-sub {
      font-size: 22px;
      color: #a1a1a6;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .weather-container {
      display: flex;
      width: 100%;
      justify-content: space-around;
      background-color: #1c1c1e;
      border-radius: 12px;
      padding: 12px 10px;
    }

    .weather-box {
      text-align: center;
      flex: 1;
    }
    
    .weather-box:first-child {
      border-right: 1px solid #333;
    }

    .weather-district {
      font-size: 16px;
      color: #0a84ff;
      font-weight: 600;
    }

    .weather-temp {
      font-size: 28px;
      font-weight: bold;
      margin-top: 2px;
    }

    /* 第二行：巴士看板清單 */
    .section-bottom {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: 15px;
      overflow-y: auto;
    }

    .bus-card {
      background-color: #1c1c1e;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .bus-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #2c2c2e;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .company-tag {
      font-size: 14px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      margin-right: 8px;
    }
    .bg-kmb { background-color: #e60012; color: #fff; }
    .bg-lwb { background-color: #ff9500; color: #fff; }
    .bg-ctb { background-color: #0055a5; color: #fff; }

    .route-no {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
    }

    .dest-name {
      font-size: 20px;
      color: #ffd60a;
      font-weight: 600;
    }

    .eta-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .eta-next {
      display: flex;
      flex-direction: column;
    }

    .eta-label {
      font-size: 12px;
      color: #8e8e93;
    }

    .eta-primary {
      font-size: 48px;
      font-weight: bold;
      color: #30d158;
      line-height: 1.1;
    }

    .eta-secondary-group {
      display: flex;
      gap: 15px;
      text-align: right;
    }

    .eta-secondary {
      font-size: 18px;
      color: #ebebf599;
    }

    .footer-bar {
      font-size: 12px;
      color: #636366;
      text-align: center;
      padding-top: 5px;
    }
  </style>
</head>
<body>

  <!-- 第一行：時間、日期與雙區天氣 -->
  <div class="section-top">
    <div id="clock" class="time-large">00:00</div>
    <div id="date" class="date-sub">----年--月--日 星期-</div>
    
    <div class="weather-container">
      <div class="weather-box">
        <div class="weather-district" id="dist1-name">觀塘</div>
        <div class="weather-temp" id="dist1-temp">--°C</div>
      </div>
      <div class="weather-box">
        <div class="weather-district" id="dist2-name">中環</div>
        <div class="weather-temp" id="dist2-temp">--°C</div>
      </div>
    </div>
  </div>

  <!-- 第二行：巴士即時到站資訊 -->
  <div class="section-bottom" id="bus-list">
    <!-- 動態生成巴士資訊 -->
  </div>

  <div class="footer-bar" id="last-update">即時數據連線中...</div>

  <script>
    /* ================= 1. 自訂設定區 ================= */

    // 指定兩個顯示天氣的地區（需符合香港天文台站點名稱）
    var WEATHER_DIST1 = "觀塘";
    var WEATHER_DIST2 = "香港公園"; // 中環附近站點

    // 監控巴士路線清單設定
    // company: "KMB" | "LWB" | "CTB"
    // dir: "O" (去程 Outbound) 或 "I" (回程 Inbound)
    // stopId: 九巴/龍運請填 Stop Code (例如 "BS18-T-1000-0")；城巴請填 Stop ID (例如 "002410")
    var BUS_CONFIGS = [
      { company: "KMB", route: "1A", dir: "O", serviceType: "1", stopId: "BS18-T-1000-0" },
      { company: "LWB", route: "A29", dir: "O", serviceType: "1", stopId: "003533" },
      { company: "CTB", route: "720", dir: "O", stopId: "001250" }
    ];

    /* ================= 2. 時鐘與日期模組 ================= */
    function updateClock() {
      var now = new Date();
      var h = String(now.getHours());
      var m = String(now.getMinutes());
      if (h.length < 2) h = "0" + h;
      if (m.length < 2) m = "0" + m;

      document.getElementById("clock").innerText = h + ":" + m;

      var y = now.getFullYear();
      var mon = now.getMonth() + 1;
      var d = now.getDate();
      var days = ["日", "一", "二", "三", "四", "五", "六"];
      document.getElementById("date").innerText = y + "年" + mon + "月" + d + "日 星期" + days[now.getDay()];
    }

    /* ================= 3. 香港天文台 API 模組 ================= */
    function fetchWeather() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc", true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var tempArray = data.temperature.data;
            
            document.getElementById("dist1-name").innerText = WEATHER_DIST1;
            document.getElementById("dist2-name").innerText = WEATHER_DIST2;

            for (var i = 0; i < tempArray.length; i++) {
              if (tempArray[i].place === WEATHER_DIST1) {
                document.getElementById("dist1-temp").innerText = tempArray[i].value + "°C";
              }
              if (tempArray[i].place === WEATHER_DIST2) {
                document.getElementById("dist2-temp").innerText = tempArray[i].value + "°C";
              }
            }
          } catch(e) {}
        }
      };
      xhr.send();
    }

    /* ================= 4. 巴士 ETA API 模組 (兼容 iOS 12) ================= */
    function fetchBusData() {
      var container = document.getElementById("bus-list");
      container.innerHTML = ""; // 重設視圖

      for (var i = 0; i < BUS_CONFIGS.length; i++) {
        (function(cfg) {
          if (cfg.company === "KMB" || cfg.company === "LWB") {
            getKmbEta(cfg);
          } else if (cfg.company === "CTB") {
            getCtbEta(cfg);
          }
        })(BUS_CONFIGS[i]);
      }

      var now = new Date();
      var s = String(now.getSeconds());
      if (s.length < 2) s = "0" + s;
      document.getElementById("last-update").innerText = "最後更新： " + document.getElementById("clock").innerText + ":" + s;
    }

    // 九巴 / 龍運 ETA 處理
    function getKmbEta(cfg) {
      var url = "https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/" + cfg.stopId;
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var res = JSON.parse(xhr.responseText);
            var etas = [];
            var dest = "未知總站";

            for (var i = 0; i < res.data.length; i++) {
              var item = res.data[i];
              if (item.route === cfg.route && item.dir === cfg.dir) {
                if (item.dest_tc) dest = item.dest_tc;
                if (item.eta) {
                  etas.push(parseMinutes(item.eta));
                }
              }
            }
            renderBusCard(cfg.company, cfg.route, dest, etas);
          } catch(e) {}
        }
      };
      xhr.send();
    }

    // 城巴 ETA 處理
    function getCtbEta(cfg) {
      var url = "https://data.etabus.gov.hk/v1/transport/citybus/eta/CTB/" + cfg.stopId + "/" + cfg.route;
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var res = JSON.parse(xhr.responseText);
            var etas = [];
            var dest = "未知總站";

            for (var i = 0; i < res.data.length; i++) {
              var item = res.data[i];
              // 城巴 dir 轉換: O -> O, I -> I
              if (item.dir === cfg.dir) {
                if (item.dest_tc) dest = item.dest_tc;
                if (item.eta) {
                  etas.push(parseMinutes(item.eta));
                }
              }
            }
            renderBusCard(cfg.company, cfg.route, dest, etas);
          } catch(e) {}
        }
      };
      xhr.send();
    }

    // 計算剩餘分鐘數
    function parseMinutes(isoTimeString) {
      var etaTime = new Date(isoTimeString).getTime();
      var nowTime = new Date().getTime();
      var diff = Math.floor((etaTime - nowTime) / 60000);
      return diff <= 0 ? "即將到站" : diff + " 分鐘";
    }

    /* ================= 5. 動態 UI 渲染 ================= */
    function renderBusCard(company, route, dest, etas) {
      var container = document.getElementById("bus-list");

      var card = document.createElement("div");
      card.className = "bus-card";

      var bgClass = "bg-kmb";
      if (company === "LWB") bgClass = "bg-lwb";
      if (company === "CTB") bgClass = "bg-ctb";

      var primaryEta = etas[0] ? etas[0] : "尾班車已過";
      var secEta1 = etas[1] ? etas[1] : "--";
      var secEta2 = etas[2] ? etas[2] : "--";

      card.innerHTML = 
        '<div class="bus-header">' +
          '<div>' +
            '<span class="company-tag ' + bgClass + '">' + company + '</span>' +
            '<span class="route-no">' + route + '</span>' +
          '</div>' +
          '<div class="dest-name">往 ' + dest + '</div>' +
        '</div>' +
        '<div class="eta-container">' +
          '<div class="eta-next">' +
            '<span class="eta-label">下一班車</span>' +
            '<span class="eta-primary">' + primaryEta + '</span>' +
          '</div>' +
          '<div class="eta-secondary-group">' +
            '<div><div class="eta-label">下二班</div><div class="eta-secondary">' + secEta1 + '</div></div>' +
            '<div><div class="eta-label">下三班</div><div class="eta-secondary">' + secEta2 + '</div></div>' +
          '</div>' +
        '</div>';

      container.appendChild(card);
    }

    /* ================= 6. 定時觸發與初始化 ================= */
    updateClock();
    fetchWeather();
    fetchBusData();

    setInterval(updateClock, 1000);        // 時間每秒更新
    setInterval(fetchWeather, 600000);     // 天氣每 10 分鐘更新
    setInterval(fetchBusData, 20000);       // 巴士到站時間每 20 秒自動刷新
  </script>
</body>
</html>
